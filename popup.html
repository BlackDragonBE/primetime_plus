<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      padding: 20px;
      font-family: Arial, sans-serif;
    }
    
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    
    .logo {
      font-size: 18px;
      font-weight: bold;
      color: #2c3e50;
    }
    
    .version {
      font-size: 12px;
      color: #7f8c8d;
    }
    
    .info {
      background-color: #ecf0f1;
      padding: 15px;
      border-radius: 5px;
      margin-bottom: 15px;
    }
    
    .feature {
      display: flex;
      align-items: center;
      margin: 10px 0;
    }
    
    .feature-icon {
      width: 16px;
      height: 16px;
      margin-right: 10px;
      background-color: #27ae60;
      border-radius: 50%;
    }
    
    .feature-text {
      font-size: 14px;
      color: #2c3e50;
    }
    
    .status {
      text-align: center;
      padding: 10px;
      background-color: #d5f4e6;
      border-radius: 5px;
      color: #27ae60;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">Prime Time Plus</div>
    <div class="version">v1.0.0</div>
  </div>
  
  <div class="info">
    <h3>Active Features:</h3>
    <div class="feature">
      <div class="feature-icon"></div>
      <div class="feature-text">Working days calculator</div>
    </div>
  </div>
  
  <div class="status">
    ✓ Extension Active
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
